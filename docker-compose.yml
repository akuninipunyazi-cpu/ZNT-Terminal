services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: znt_terminal
      POSTGRES_USER: znt
      POSTGRES_PASSWORD: znt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir apps/api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    env_file:
      - .env
    command: npm run dev:web
    ports:
      - "3001:3000"
    depends_on:
      - api

  ingestor:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    command: python -m services.market_ingestor
    restart: unless-stopped
    depends_on:
      - redis

  engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    command: python -m services.screening_engine
    restart: unless-stopped
    depends_on:
      - redis
      - ingestor

volumes:
  postgres-data:
  redis-data:
