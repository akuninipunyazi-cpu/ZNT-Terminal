[program:znt-api]
directory=/opt/znt-terminal
command=/opt/znt-terminal/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir apps/api
autostart=true
autorestart=true
stderr_logfile=/var/log/znt-api.err.log
stdout_logfile=/var/log/znt-api.out.log

[program:znt-web]
directory=/opt/znt-terminal
command=/usr/bin/npm run dev:web
autostart=true
autorestart=true
stderr_logfile=/var/log/znt-web.err.log
stdout_logfile=/var/log/znt-web.out.log
