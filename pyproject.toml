[project]
name = "znt-terminal"
version = "0.1.0"
description = "Z Nexus Trade anomaly screening terminal"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "numpy>=2.2.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  "pydantic-settings>=2.7.0",
  "python-jose[cryptography]>=3.3.0",
  "PyYAML>=6.0.2",
  "redis>=5.2.1",
  "SQLAlchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "websockets>=14.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4"
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "apps/api",
  "services/screening_engine",
  "services/market_ingestor",
  "packages/python_common"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"
